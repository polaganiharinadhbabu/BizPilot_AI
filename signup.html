<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BizPilot AI · Create account</title><link rel="stylesheet" href="style.css"></head>
<body class="login-body"><main class="login-shell"><section class="login-brand"><div class="brand-mark">✦</div><div class="brand-name">BizPilot <span>AI</span></div><p>Smarter business. Simpler.</p><div class="brand-art"><div class="art-orbit"></div><div class="art-card"><span>＋</span><strong>Start with clarity</strong><small>Your business workspace, in one place.</small></div></div><small class="muted">Create your workspace account.</small></section>
<section class="login-panel"><div class="mobile-brand"><span class="brand-mark">✦</span><strong>BizPilot <span>AI</span></strong></div><div class="login-heading"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Join BizPilot AI in a few steps.</p></div>
<form id="signupForm" class="form-stack"><label>Full name<input id="signupName" type="text" autocomplete="name" maxlength="100" placeholder="Your name" required></label><label>Email address<input id="signupEmail" type="email" autocomplete="email" placeholder="you@company.com" required></label><label>Password<input id="signupPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters" required></label><label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Re-enter your password" required></label><button class="btn btn-primary full" type="submit">Create account <span>→</span></button></form><p id="loginMessage" class="message" role="status"></p><p class="auth-links">Already have an account? <a href="index.html">Sign in</a></p><p class="auth-note">Your account is created with the standard user role.</p></section></main><script src="app.js"></script></body></html>
